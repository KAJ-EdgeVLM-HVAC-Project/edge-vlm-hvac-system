name: CI

# PR 게이트: main/feature 브랜치로의 PR과 push에서 린트·테스트를 자동 실행한다.
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CI dependencies
        # CI는 GPU/torch가 없으므로 순수 도메인 로직 검증에 필요한 도구만 설치
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Lint (런타임 크래시 코드 게이트)
        run: flake8 .

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile \
            main.py vlm_processor.py control_logic.py thermal_engine.py \
            pid_controller.py hvac_simulator.py state_machine.py \
            energy_monitor.py dashboard.py user_display.py

      - name: Unit tests (pytest)
        run: pytest tests/ -q
