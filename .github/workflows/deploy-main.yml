name: 🚀 Deploy to Main

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["CI Matrix"]
    types:
      - completed
    branches:
      - main

jobs:
  # ========== Step 1: 배포 전 검증 ==========
  pre-deployment-check:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success')
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-deploy: ${{ steps.check.outputs.should-deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from git tag
        id: version
        run: |
          VERSION=$(git describe --tags --always --match "v*" 2>/dev/null || echo "dev")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📌 Deploying version: $VERSION"

      - name: Validate Python syntax
        id: check
        run: |
          echo "Running syntax validation..."
          if python -m py_compile main.py control_logic.py vlm_processor.py 2>&1; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Syntax validation passed"
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
            echo "❌ Syntax validation failed"
            exit 1
          fi

  # ========== Step 2: 배포 준비 ==========
  prepare-deployment:
    name: Prepare Deployment Package
    runs-on: ubuntu-latest
    needs: pre-deployment-check
    if: needs.pre-deployment-check.outputs.should-deploy == 'true'
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements_jetson.txt ]; then
            pip install -r requirements_jetson.txt
          fi

      - name: Generate deployment manifest
        run: |
          cat > deployment-manifest.json << EOF
          {
            "version": "${{ needs.pre-deployment-check.outputs.version }}",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "branch": "main",
            "commit": "${{ github.sha }}",
            "actor": "${{ github.actor }}"
          }
          EOF
          cat deployment-manifest.json

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: deployment-package-${{ needs.pre-deployment-check.outputs.version }}
          path: |
            main.py
            control_logic.py
            vlm_processor.py
            dashboard.py
            requirements_jetson.txt
            deployment-manifest.json
          retention-days: 30

  # ========== Step 3: 헬스 체크 ==========
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: prepare-deployment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements_jetson.txt ]; then
            pip install -r requirements_jetson.txt 2>&1 | grep -v "already satisfied" || true
          fi

      - name: Run startup check
        timeout-minutes: 2
        run: |
          echo "🏥 Starting health check..."
          python -c "
          import sys
          try:
              # Core modules 검증
              import main
              import control_logic
              import vlm_processor
              from env_profiles import PROFILE_CONFIGS
              
              # 기본 초기화 테스트
              if hasattr(main, 'HVAC_SYSTEM'):
                  print('✅ Main module initialized')
              if PROFILE_CONFIGS:
                  print('✅ Environment profiles loaded')
              
              print('✅ Health check passed')
              sys.exit(0)
          except Exception as e:
              print(f'❌ Health check failed: {e}')
              sys.exit(1)
          "

  # ========== Step 4: 스모크 테스트 ==========
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: prepare-deployment
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run basic unit tests
        run: |
          python -m pip install pytest pytest-cov
          if [ -f tests/test_core.py ]; then
            pytest tests/test_core.py -v --tb=short --maxfail=3 || true
          else
            echo "⚠️  No test file found, skipping tests"
          fi

  # ========== Step 5: 배포 알림 ==========
  deployment-notification:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [pre-deployment-check, health-check, smoke-test]
    if: always()
    steps:
      - name: Generate deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.pre-deployment-check.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Pre-deployment Check: ${{ needs.pre-deployment-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Health Check: ${{ needs.health-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Smoke Test: ${{ needs.smoke-test.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Create deployment record
        run: |
          mkdir -p deployment-logs
          cat > deployment-logs/deploy-${{ github.sha }}.log << EOF
          Deployment Log
          ==============
          Version: ${{ needs.pre-deployment-check.outputs.version }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Branch: main
          Status: SUCCESS
          EOF
          cat deployment-logs/deploy-${{ github.sha }}.log

      - name: ✅ Deployment Success
        if: needs.pre-deployment-check.result == 'success' && needs.health-check.result == 'success'
        run: |
          echo "✅ Main branch deployment successful"
          echo "🎯 Version: ${{ needs.pre-deployment-check.outputs.version }}"

      - name: ⚠️ Deployment Warning
        if: needs.smoke-test.result != 'success'
        run: |
          echo "⚠️  Smoke tests had issues, but deployment completed"
          echo "Review the test results above"
